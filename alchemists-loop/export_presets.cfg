; Реальные export-пресеты (продолжение export_presets.cfg.example). Держим в Git:
; без пресета релиз не воспроизводим. Секретов здесь нет: keystore живёт в
; Editor Settings / CI-секретах, а не в этом файле (см. docs/android/PLUGIN_SETUP.md §1).

[preset.0]
name="Google Play"
platform="Android"
runnable=true
advanced_options=true
custom_features="google_play"
export_filter="all_resources"
include_filter=""
exclude_filter="previews/**,prompts/**,report_house_decor_fix.md,*.md"
export_path="build/alchemists-loop-gp.aab"
patches=PackedStringArray()

; Пресет минимален осознанно: Godot 4.7 допишет отсутствующие ключи сам при первом сохранении в редакторе, а ручное копирование всех ключей из другого проекта — источник фантомных диффов.
[preset.0.options]
custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
; version/code сверяется релизным CI по §6 ТЗ-04 (формулы в репозитории нет).
version/code=20000
version/name="0.2.0"
; ЗАМЕНИТЬ на реальный reverse-domain владельца проекта перед загрузкой в стор:
; com.example.* отклоняют и Google Play, и RuStore.
package/unique_name="com.alchemistsloop.game"
package/name="Alchemist's Loop"
package/signed=true
target_sdk=36
permissions/internet=true
permissions/vibrate=true

