name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy discovery-server to VPS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            
            echo "🚀 Starting deployment to ${{ github.event.inputs.environment }}..."
            
            # Navigate to app directory
            cd /opt/alchemists-loop
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git pull origin master
            
            # Install/update dependencies
            echo "📦 Installing dependencies..."
            cd discovery-server/server
            python3 -m pip install --upgrade pip
            python3 -m pip install -r requirements.txt --user
            
            # Run migrations if needed
            if [ -f "migrations.py" ]; then
              echo "🗄️ Running migrations..."
              python3 migrations.py || echo "No migrations to run"
            fi
            
            # Restart service
            echo "🔄 Restarting discovery-server..."
            sudo systemctl restart discovery-server
            
            # Wait for service to start
            sleep 3
            
            # Check service status
            if sudo systemctl is-active --quiet discovery-server; then
              echo "✅ Deployment successful!"
              sudo systemctl status discovery-server --no-pager
            else
              echo "❌ Service failed to start"
              sudo systemctl status discovery-server --no-pager
              sudo journalctl -u discovery-server -n 50 --no-pager
              exit 1
            fi
