name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, init, 'arena/**' ]
  workflow_dispatch:
    inputs:
      shots:
        description: 'Снять кадры UI (ui-shots) — выключить для быстрого прогона тестов'
        type: boolean
        default: true
      sha:
        description: 'Прогнать конкретный SHA (пусто = текущая ревизия) — для сравнения с базовой ревизией'
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discovery-server/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: discovery-server/server/requirements*.txt
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  lint:
    name: "Lint (ruff: syntax + real errors)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check --isolated --select E9,F63,F7,F82 .

  security:
    name: Security scan (bandit HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install bandit
        run: pip install bandit
      - name: Bandit
        run: bandit -r discovery-server/server --exclude discovery-server/server/tests -lll -q

  selftest:
    # Прогон игровой логики и компиляции GDScript: ловит parse-ошибки вроде
    # несовместимого типа при присваивании — ровно то, что проскочило в
    # UI-итерации-2 (home.gd: GridContainer в переменную типа VBoxContainer)
    # и ранее не проверялось в CI вовсе.
    name: Game selftest (Godot headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # inputs.sha только при workflow_dispatch (сравнение с базовой ревизией);
          # иначе — обычная ревизия триггера (push/PR).
          ref: ${{ inputs.sha || github.sha }}
      - name: Download Godot 4.7.2
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project (ресурсы/uid)
        run: |
          "$GODOT" --headless --import --path alchemists-loop || true
      - name: UI probe (UiTheme/UiStyle/UiIcon — до селфтеста)
        run: |
          status=0
          "$GODOT" --headless --path alchemists-loop --script res://tools/ui_probe.gd 2>&1 \
            | tee "$RUNNER_TEMP/probe.log" || status=$?
          grep -E 'PROBE' "$RUNNER_TEMP/probe.log" || true
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done \
              < <(grep -E 'PROBE FAIL|SCRIPT ERROR|Invalid call|VEIN T4 debug' "$RUNNER_TEMP/probe.log" | head -40)
          fi
          exit "$status"
      - name: Selftest (+ аннотации [FAIL]/SCRIPT ERROR для агентов)
        run: |
          status=0
          alchemists-loop/tools/run_selftest.sh 2>&1 | tee "$RUNNER_TEMP/selftest.log" || status=$?
          echo '## Selftest' >> "$GITHUB_STEP_SUMMARY"
          if grep -Eq '^\[FAIL\]|SCRIPT ERROR|VEIN T4 debug' "$RUNNER_TEMP/selftest.log"; then
            grep -E '^\[FAIL\]|SCRIPT ERROR|VEIN T4 debug' "$RUNNER_TEMP/selftest.log" | head -60 \
              | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'падений и SCRIPT ERROR не найдено' >> "$GITHUB_STEP_SUMMARY"
          fi
          # SCRIPT ERROR ломает прогон даже при 725/725: рантайм-ошибки скриптов
          # (вроде несуществующей функции) не дают [FAIL], но ломают игру.
          if [ "$status" -ne 0 ] || grep -q 'SCRIPT ERROR' "$RUNNER_TEMP/selftest.log"; then
            while IFS= read -r line; do echo "::error::$line"; done \
              < <(grep -E '^\[FAIL\]|SCRIPT ERROR|VEIN T4 debug' "$RUNNER_TEMP/selftest.log" | head -40)
            echo "selftest: статус=$status, SCRIPT ERROR присутствует — прогон красный"
            exit 1
          fi

  ui-shots:
    # Кадры приёмки РЕАЛЬНОЙ игры (та же механика, что tools/shots.py локально):
    # на PR снимается head и базовая ветка, кладётся compare-отчёт + оба набора
    # артефактом. Ручной запуск (workflow_dispatch) — чтобы агенты/люди могли
    # получить кадры без локального Godot. Быстрый прогон тестов без кадров:
    #   gh workflow run CI.yml --ref <ветка> -f shots=false
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.shots)
    name: UI shots (кадры приёмки, артефакт)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha || 'master' }}
          path: base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Pillow (compare)
        run: pip install pillow
      - name: Download Godot 4.7.2
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Xvfb (рендер кадров)
        run: |
          command -v xvfb-run >/dev/null 2>&1 || \
            (sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0)
      - name: Shots — head (эта ревизия)
        run: python3 alchemists-loop/tools/shots.py run head
      - name: Shots — base (базовая ветка)
        run: python3 alchemists-loop/tools/shots.py run base --project "$GITHUB_WORKSPACE/base/alchemists-loop"
      - name: Compare base→head (report.md + montage)
        if: always()
        run: python3 alchemists-loop/tools/shots.py compare base head
      - name: Upload кадры и отчёт
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-shots
          path: |
            alchemists-loop/previews/shots/
            docs/ui-ux/shots-diff/
          if-no-files-found: warn
          retention-days: 14
