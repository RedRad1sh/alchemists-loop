name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, init ]

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discovery-server/server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: discovery-server/server/requirements*.txt
      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q

  lint:
    name: "Lint (ruff: syntax + real errors)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check --isolated --select E9,F63,F7,F82 .

  security:
    name: Security scan (bandit HIGH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install bandit
        run: pip install bandit
      - name: Bandit
        run: bandit -r discovery-server/server --exclude discovery-server/server/tests -lll -q

  selftest:
    # Прогон игровой логики и компиляции GDScript: ловит parse-ошибки вроде
    # несовместимого типа при присваивании — ровно то, что проскочило в
    # UI-итерации-2 (home.gd: GridContainer в переменную типа VBoxContainer)
    # и ранее не проверялось в CI вовсе.
    name: Game selftest (Godot headless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download Godot 4.7.2
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fsSL -o "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import project (ресурсы/uid)
        run: |
          "$GODOT" --headless --import --path alchemists-loop || true
      - name: Selftest
        run: alchemists-loop/tools/run_selftest.sh
